<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — LearnAtYourOwnPace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1E3A8A; --blue-dark: #162d6e; --blue-light: #2547a8;
      --blue-50: #eff4ff; --blue-100: #dbe6fe;
      --gold: #D4A017; --gold-light: #f0bb30; --gold-50: #fdf7e3;
      --white: #FFFFFF;
      --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-400: #94a3b8; --gray-600: #475569;
      --text: #1a2540; --text-light: #4a5568;
      --green: #16a34a; --green-50: #f0fdf4; --green-100: #dcfce7;
      --red: #dc2626; --red-50: #fef2f2; --red-100: #fecaca;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', 'Segoe UI', sans-serif;
      --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 9999px;
      --shadow-md: 0 4px 16px rgba(30,58,138,0.10);
      --shadow-lg: 0 12px 40px rgba(30,58,138,0.14);
      --transition: 0.2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      min-height: 100vh;
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, var(--blue-light) 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* ── Card ── */
    .signup-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
    }

    /* ── Logo ── */
    .logo-link {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; font-size: 1rem; color: var(--blue);
      margin-bottom: 1.75rem; text-decoration: none;
    }
    .logo-link span { color: var(--gold); }
    .logo-link img { border-radius: 50%; }

    /* ── Role selector ── */
    .role-selector {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .role-card {
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--white);
    }
    .role-card:hover { border-color: var(--blue-100); background: var(--blue-50); }
    .role-card.selected { border-color: var(--blue); background: var(--blue-50); }
    .role-card.selected .role-icon { background: var(--blue); color: var(--white); }
    .role-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; margin: 0 auto 0.5rem;
      transition: all var(--transition);
    }
    .role-title { font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 0.2rem; }
    .role-desc { font-size: 0.75rem; color: var(--text-light); line-height: 1.4; }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 0.35rem; }
    .form-input {
      width: 100%; padding: 0.72rem 1rem;
      border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
      font-size: 0.92rem; font-family: var(--font-body);
      color: var(--text); background: var(--white);
      outline: none; transition: border-color var(--transition);
    }
    .form-input:focus { border-color: var(--blue); }
    .form-input.error { border-color: var(--red); }
    select.form-input { cursor: pointer; }

    /* Niche field (instructor only) */
    .instructor-only { display: none; }
    .instructor-only.visible { display: block; }

    /* ── Password strength ── */
    .password-strength {
      height: 4px; background: var(--gray-200);
      border-radius: 2px; margin-top: 0.4rem; overflow: hidden;
    }
    .strength-fill {
      height: 100%; width: 0%; border-radius: 2px;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-label { font-size: 0.72rem; color: var(--gray-400); margin-top: 0.25rem; }

    /* ── Buttons ── */
    .btn-submit {
      width: 100%; padding: 0.85rem;
      background: var(--gold); color: var(--blue-dark);
      border: none; border-radius: var(--radius-sm);
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all var(--transition);
      margin-top: 0.5rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-submit:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* ── Spinner ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(30,58,138,0.25);
      border-top-color: var(--blue-dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert boxes ── */
    .alert {
      display: none; padding: 0.75rem 1rem;
      border-radius: var(--radius-sm); font-size: 0.85rem;
      margin-bottom: 1rem; line-height: 1.5;
    }
    .alert.error { background: var(--red-50); color: var(--red); border: 1px solid var(--red-100); }
    .alert.success { background: var(--green-50); color: var(--green); border: 1px solid var(--green-100); }
    .alert.show { display: block; }

    /* ── Success state ── */
    .success-view {
      display: none; text-align: center; padding: 1rem 0;
    }
    .success-view.show { display: block; }
    .success-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--green-50); border: 2px solid var(--green-100);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin: 0 auto 1rem;
    }

    /* ── Footer links ── */
    .card-footer {
      text-align: center; margin-top: 1.25rem;
      font-size: 0.85rem; color: var(--text-light);
    }
    .card-footer a { color: var(--blue); font-weight: 600; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.25rem; font-size: 0.78rem; color: var(--gray-400);
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }

    /* ── Heading ── */
    .card-title { font-family: var(--font-display); font-size: 1.6rem; color: var(--text); margin-bottom: 0.25rem; }
    .card-sub { font-size: 0.88rem; color: var(--text-light); margin-bottom: 1.5rem; }

    @media (max-width: 480px) {
      .signup-card { padding: 1.5rem; }
      .role-selector { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="signup-card">

  <!-- Logo -->
  <a href="../index.html" class="logo-link">
    <img src="../assets/img/logo.png" alt="LearnAtYourOwnPace logo" width="34" height="34" />
    Learn<span>AtYourOwnPace</span>
  </a>

  <!-- Form view -->
  <div id="form-view">
    <h1 class="card-title">Create your account</h1>
    <p class="card-sub">Free to start. No credit card required.</p>

    <!-- Role selector -->
    <div class="divider">I am a</div>
    <div class="role-selector">
      <div class="role-card selected" id="role-learner" onclick="selectRole('learner')">
        <div class="role-icon">🧑‍🎓</div>
        <div class="role-title">Learner</div>
        <div class="role-desc">I want to take courses and build skills</div>
      </div>
      <div class="role-card" id="role-instructor" onclick="selectRole('instructor')">
        <div class="role-icon">👩‍🏫</div>
        <div class="role-title">Instructor</div>
        <div class="role-desc">I want to build and sell my own courses</div>
      </div>
    </div>

    <!-- Alert box -->
    <div class="alert error" id="error-box"></div>

    <!-- Full name -->
    <div class="form-group">
      <label class="form-label" for="full_name">Full name</label>
      <input type="text" id="full_name" class="form-input" placeholder="Your full name" autocomplete="name" />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)" />
      <div class="password-strength"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="strength-label" id="strength-label"></div>
    </div>

    <!-- Niche (instructor only) -->
    <div class="form-group instructor-only" id="niche-group">
      <label class="form-label" for="niche">What do you teach?</label>
      <select id="niche" class="form-input">
        <option value="">Select your main niche…</option>
        <option>Marketing</option>
        <option>Sales</option>
        <option>Leadership</option>
        <option>Operations</option>
        <option>Finance</option>
        <option>Technology</option>
        <option>Design</option>
        <option>Wellness</option>
        <option>Productivity</option>
        <option>Entrepreneurship</option>
        <option>Communication</option>
        <option>HR &amp; People Ops</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Submit -->
    <button class="btn-submit" id="submit-btn" onclick="handleSignup()">
      Create free account
    </button>

    <div class="card-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <!-- Success view (shown after signup) -->
  <div class="success-view" id="success-view">
    <div class="success-icon">✅</div>
    <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:0.5rem;color:var(--text)">You're in!</h2>
    <p id="success-message" style="font-size:0.9rem;color:var(--text-light);margin-bottom:1.5rem;line-height:1.6"></p>
    <a href="login.html" style="display:inline-block;padding:0.75rem 2rem;background:var(--gold);color:var(--blue-dark);border-radius:var(--radius-sm);font-weight:700;font-size:0.95rem">
      Go to login →
    </a>
    <div style="margin-top:1rem;font-size:0.82rem;color:var(--gray-400)">
      <a href="../index.html" style="color:var(--gray-400)">← Back to homepage</a>
    </div>
  </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  )
</script>

<script>
  let selectedRole = 'learner'

  // Role selector
  function selectRole(role) {
    selectedRole = role
    document.getElementById('role-learner').classList.toggle('selected', role === 'learner')
    document.getElementById('role-instructor').classList.toggle('selected', role === 'instructor')
    document.getElementById('niche-group').classList.toggle('visible', role === 'instructor')
  }

  // Password strength checker
  function checkStrength(val) {
    const fill = document.getElementById('strength-fill')
    const label = document.getElementById('strength-label')
    let score = 0
    if (val.length >= 8) score++
    if (/[A-Z]/.test(val)) score++
    if (/[0-9]/.test(val)) score++
    if (/[^A-Za-z0-9]/.test(val)) score++
    const levels = [
      { w: '0%',   color: '',          text: '' },
      { w: '25%',  color: '#dc2626',   text: 'Weak' },
      { w: '50%',  color: '#ea580c',   text: 'Fair' },
      { w: '75%',  color: '#ca8a04',   text: 'Good' },
      { w: '100%', color: '#16a34a',   text: 'Strong' },
    ]
    fill.style.width = levels[score].w
    fill.style.background = levels[score].color
    label.textContent = levels[score].text
    label.style.color = levels[score].color
  }

  // Show error
  function showError(msg) {
    const box = document.getElementById('error-box')
    box.textContent = msg
    box.classList.add('show')
  }
  function hideError() {
    document.getElementById('error-box').classList.remove('show')
  }

  // Main signup function
  async function handleSignup() {
    hideError()

    const fullName = document.getElementById('full_name').value.trim()
    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value.trim()
    const niche    = selectedRole === 'instructor' ? document.getElementById('niche').value : null
    const btn      = document.getElementById('submit-btn')

    // Validate
    if (!fullName) { showError('Please enter your full name.'); return }
    if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return }
    if (selectedRole === 'instructor' && !niche) { showError('Please select your teaching niche.'); return }

    // Show spinner
    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span> Creating account…'

    // Create auth account
    const { data, error } = await supabaseClient.auth.signUp({ email, password })

    if (error) {
      showError(error.message)
      btn.disabled = false
      btn.innerHTML = 'Create free account'
      return
    }

    // Save profile to profiles table
    const { error: profileError } = await supabaseClient.from('profiles').insert({
      email:     email,
      full_name: fullName,
      role:      selectedRole === 'instructor' ? 'admin' : 'learner',
      plan:      'free',
      is_active: true,
      // niche saved if instructor — you can add a niche column to profiles later
    })

    if (profileError) {
      showError('Account created but profile save failed. Please contact support.')
      btn.disabled = false
      btn.innerHTML = 'Create free account'
      return
    }

    // Show success
    document.getElementById('form-view').style.display = 'none'
    const successView = document.getElementById('success-view')
    successView.classList.add('show')

    const msg = selectedRole === 'instructor'
      ? `Welcome, ${fullName}! Your instructor account is ready. Log in to start building your first course.`
      : `Welcome, ${fullName}! Your learner account is ready. Log in to start exploring courses.`
    document.getElementById('success-message').textContent = msg
  }
</script>

</body>
</html>
